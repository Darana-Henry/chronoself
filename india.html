<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>India — ChronoSelf</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --accent: #818cf8;
  --accent-soft: rgba(129,140,248,0.12);
  --accent-line: rgba(129,140,248,0.45);
  --txt: #e8eaed;
  --txt-mid: #9aa0a6;
  --txt-dim: #5f6368;
  --line: rgba(255,255,255,0.08);
  --card: rgba(255,255,255,0.035);
}

html, body {
  min-height: 100%;
  background: #0a0a0a;
  color: var(--txt);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}

body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
  background-size: 48px 48px;
}

.page {
  position: relative; z-index: 1;
  max-width: 1760px;
  margin: 0 auto;
  padding: 64px 24px 40px;
}
.embedded .page { padding-top: 22px; }

.back-link {
  position: fixed; top: 20px; left: 24px; z-index: 10;
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 600; letter-spacing: 0.3px;
  color: var(--txt-dim); text-decoration: none; transition: color 0.15s;
}
.back-link:hover { color: var(--txt-mid); }
.back-link svg { width: 14px; height: 14px; }
.embedded .back-link { display: none; }

.header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px 24px; flex-wrap: wrap; margin-bottom: 18px; }
.title {
  font-size: clamp(28px, 4vw, 40px); font-weight: 700; letter-spacing: -1px;
  background: linear-gradient(135deg, #e8eaed 30%, #9aa0a6);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.subtitle { font-size: 13px; color: var(--txt-dim); margin-top: 4px; }

.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button, .chip-btn {
  background: transparent; border: 0; color: var(--txt-mid);
  font: 600 12px/1 inherit; font-family: inherit; padding: 8px 12px; cursor: pointer;
}
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--accent-soft); color: var(--accent); }
.chip-btn { border: 1px solid var(--line); border-radius: 10px; }
.chip-btn.on { color: var(--accent); border-color: var(--accent-line); background: var(--accent-soft); }
.jump {
  background: #111; color: var(--txt); border: 1px solid var(--line); border-radius: 10px;
  font: 500 12px inherit; font-family: inherit; padding: 7px 10px; max-width: 220px;
}
.seg button:focus-visible, .chip-btn:focus-visible, .jump:focus-visible, .close:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-bottom: 14px; font-size: 11px; color: var(--txt-mid); min-height: 16px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

/* ── Stage: map slides left when a state opens ── */
.stage { display: flex; align-items: flex-start; }
.map-wrap {
  --w: min(100%, max(420px, calc((100vh - 170px) * 0.898)));
  flex: 0 0 auto; width: var(--w); aspect-ratio: 1000 / 1114;
  margin-left: calc((100% - var(--w)) / 2);
  transition: width 0.5s ease, margin-left 0.5s ease;
}
.embedded .map-wrap { --w: min(100%, max(420px, calc((100vh - 130px) * 0.898))); }
.stage.open .map-wrap { width: min(var(--w), 100% - 844px); margin-left: 0; }
.map-wrap svg { width: 100%; height: 100%; display: block; overflow: visible; }
.hit { fill: transparent; cursor: pointer; }

.detail {
  flex: 0 0 0; width: 0; opacity: 0; overflow: hidden;
  transform: translateX(24px);
  transition: flex-basis 0.45s ease, width 0.45s ease, opacity 0.3s ease 0.1s, transform 0.45s ease, margin 0.45s ease;
}
.stage.open .detail { flex-basis: 820px; width: 820px; opacity: 1; transform: none; margin-left: 24px; }
/* Two columns: each current-result card sits beside its history card. */
.detail-inner { width: 820px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
.detail-inner > .wide { grid-column: 1 / -1; }
@media (max-width: 1240px) {
  .stage.open .map-wrap { width: min(var(--w), 100% - 444px); }
  .stage.open .detail { flex-basis: 420px; width: 420px; }
  .detail-inner { width: 420px; grid-template-columns: 1fr; }
}

/* ── Map ── */
.st { stroke: #0a0a0a; stroke-width: 0.8; stroke-linejoin: round; cursor: pointer; transition: fill 0.2s, opacity 0.25s; outline: none; }
.st:hover, .st:focus-visible { filter: brightness(1.35); }
.st:focus-visible { stroke: var(--accent); stroke-width: 1.6; }
.stage.open .st { opacity: 0.55; }
.stage.open .st.sel { opacity: 1; stroke: #fff; stroke-width: 1.6; }
.lbl, .cap-lbl, .callout { pointer-events: none; paint-order: stroke; stroke: rgba(10,10,10,0.85); stroke-linejoin: round; }
.lbl { fill: #f1f3f4; font-weight: 700; text-anchor: middle; dominant-baseline: middle; stroke-width: 3; letter-spacing: 0.2px; }
.lbl.small { font-weight: 800; letter-spacing: 0.6px; }
.cap-lbl.l { text-anchor: end; }
.cap-dot { fill: #fff; stroke: #0a0a0a; stroke-width: 1.2; pointer-events: none; }
.cap-lbl { fill: #cbd5e1; font-size: 10.5px; font-style: italic; stroke-width: 2.6; }
.leader { stroke: rgba(255,255,255,0.35); stroke-width: 0.8; pointer-events: none; }
.no-caps .cap-dot, .no-caps .cap-lbl { display: none; }

.tip {
  position: fixed; z-index: 20; pointer-events: none;
  background: rgba(20,20,24,0.96); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 11px; font-size: 12px; line-height: 1.45; color: var(--txt);
  opacity: 0; transition: opacity 0.12s; white-space: nowrap;
}
.tip.show { opacity: 1; }
.tip small { color: var(--txt-mid); display: block; }

/* ── Detail panel ── */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; }
.d-head { position: relative; padding-right: 56px; }
.d-type { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
.d-name { font-size: 26px; font-weight: 700; letter-spacing: -0.6px; line-height: 1.15; }
.d-cap { margin-top: 6px; font-size: 13px; color: var(--txt-mid); }
.d-cap b { color: var(--txt); font-weight: 600; }
.close {
  position: absolute; top: 14px; right: 14px; width: 30px; height: 30px; border-radius: 8px;
  background: transparent; border: 1px solid var(--line); color: var(--txt-mid); cursor: pointer; font-size: 16px; line-height: 1;
}
.close:hover { color: var(--txt); border-color: rgba(255,255,255,0.2); }

.k { font-size: 10px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: var(--txt-dim); margin-bottom: 8px; }
.cm-name { font-size: 22px; font-weight: 700; letter-spacing: -0.4px; }
.party { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
.pill { font-size: 11px; font-weight: 800; letter-spacing: 0.6px; padding: 4px 9px; border-radius: 999px; color: #0a0a0a; }
.party-full { font-size: 13px; color: var(--txt); }
.alliance { font-size: 11px; color: var(--txt-mid); border: 1px solid var(--line); border-radius: 999px; padding: 3px 8px; }
.since { margin-top: 10px; font-size: 12px; color: var(--txt-mid); }
.no-cm { font-size: 14px; color: var(--txt-mid); line-height: 1.55; }

.seats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.seat { background: rgba(255,255,255,0.025); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.seat.none { background: transparent; border-style: dashed; }
.seat.none .seat-n { color: var(--txt-dim); }
.seat.none .seat-l { color: var(--txt-dim); }
.seat-n { font-size: 26px; font-weight: 700; letter-spacing: -0.6px; font-variant-numeric: tabular-nums; }
.seat-n small { font-size: 12px; font-weight: 600; color: var(--txt-mid); letter-spacing: 0; }
.seat-l { font-size: 11px; color: var(--txt-mid); margin-top: 2px; line-height: 1.35; }
.share { margin-top: 8px; height: 4px; border-radius: 4px; background: rgba(255,255,255,0.06); overflow: hidden; }
.share i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.note { font-size: 12.5px; color: var(--txt-mid); line-height: 1.55; }

/* ── Table view: every state's CMs across its last five elections ── */
.alt-view .stage, .alt-view .legend, .alt-view .map-only { display: none !important; }
.gview { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; }
.gview[hidden], .tsview[hidden] { display: none; }
.tsview { display: grid; grid-template-columns: minmax(0, 1fr); gap: 26px; }
.ts-intro { max-width: 900px; font-size: 14px; line-height: 1.6; color: var(--txt-mid); }
.ts-intro p { margin: 0 0 8px; }
.ts-score { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.ts-score .card { padding: 14px 16px; min-width: 0; }
.ts-score .t { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; margin-bottom: 10px; }
.ts-score .t b { font-size: 13px; }
.ts-score .t span { font-size: 11px; color: var(--txt-dim); white-space: nowrap; }
.ts-score .keys { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; font-size: 11.5px; color: var(--txt-mid); }
.ts-score .keys i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.ts-score .keys b { color: var(--txt); font-variant-numeric: tabular-nums; }
.ts-note { font-size: 11.5px; color: var(--txt-dim); margin-top: 8px; line-height: 1.45; }
.ts-gov { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.ts-mins { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px 18px; margin-top: 12px; font-size: 12px; }
.ts-mins b { display: block; font-weight: 700; color: color-mix(in oklab, #3b7fe0 62%, #fff); }
.ts-mins span { color: var(--txt-dim); font-size: 11px; }
.ts-parties { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.ts-party { border: 1px solid var(--line); border-top: 3px solid var(--pc); border-radius: 14px; background: var(--card); padding: 12px 14px; min-width: 0; }
.ts-party h3 { margin: 0 0 4px; font-size: 14px; color: color-mix(in oklab, var(--pc) 62%, #fff); }
.ts-party .st { font-size: 11.5px; color: var(--txt-dim); line-height: 1.45; margin-bottom: 8px; }
.ts-party .p { font-size: 12px; margin-top: 7px; }
.ts-party .p b { display: block; color: var(--txt); }
.ts-party .p span { color: var(--txt-mid); font-size: 11px; }
.ts-tl { border-left: 2px solid var(--line); margin-left: 6px; padding-left: 0; }
.ts-ev { position: relative; display: grid; grid-template-columns: 92px 92px minmax(0, 1fr); gap: 12px; padding: 9px 0 9px 18px; }
.ts-ev::before { content: ''; position: absolute; left: -6px; top: 14px; width: 10px; height: 10px; border-radius: 50%; background: #0a0a0a; border: 2px solid var(--tc); }
.ts-ev .d { font-size: 12px; color: var(--txt-mid); font-variant-numeric: tabular-nums; padding-top: 1px; }
.ts-ev .g { font-size: 10px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: var(--tc); padding-top: 2px; }
.ts-ev h4 { margin: 0 0 2px; font-size: 13.5px; color: var(--txt); }
.ts-ev p { margin: 0; font-size: 12.5px; color: var(--txt-mid); line-height: 1.5; max-width: 820px; }
.ts-ev.bg { opacity: 0.7; }
.ts-yr { margin: 14px 0 2px 18px; font-size: 11px; font-weight: 700; letter-spacing: 1px; color: var(--accent); }
.ts-two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.ts-two .card { min-width: 0; }
.ts-li { font-size: 12.5px; line-height: 1.5; color: var(--txt-mid); padding: 8px 0; border-top: 1px solid rgba(255,255,255,0.05); }
.ts-li:first-of-type { border-top: 0; }
.ts-li b { color: var(--txt); display: block; font-size: 13px; }
@media (max-width: 1100px) { .ts-gov, .ts-parties { grid-template-columns: repeat(2, minmax(0, 1fr)); } .ts-mins { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 700px) { .ts-score, .ts-two, .ts-gov, .ts-parties, .ts-mins { grid-template-columns: 1fr; } .ts-ev { grid-template-columns: 1fr; gap: 2px; } }
.gsec { min-width: 0; }
@media (max-width: 600px) { .ucards { grid-template-columns: 1fr !important; } }
.gsec h2 { font-size: 11px; font-weight: 700; letter-spacing: 0.9px; text-transform: uppercase; color: var(--accent); margin: 0 0 4px; }
.gsec .gsub { font-size: 12px; color: var(--txt-dim); margin: 0 0 10px; }
.ucards { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.ucard { border: 1px solid var(--line); border-radius: 14px; background: var(--card); padding: 12px 14px; min-width: 0; }
.ucard .k { font-size: 10px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: var(--txt-dim); }
.ucard .n { font-size: 15px; font-weight: 700; margin: 6px 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ucard .f { font-size: 12px; color: var(--txt); }
.ucard .f b { font-weight: 700; }
.ucard .m { font-size: 11px; color: var(--txt-dim); margin-top: 3px; }
@media (max-width: 1100px) { .ucards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.ctab.fixed { table-layout: fixed; }
.ctab tr.reg.cols td span { display: block; margin: 3px 0 0; }
.ctab tr.reg.cols td i { font-style: normal; font-size: 10px; font-weight: 600; color: var(--txt-dim); letter-spacing: 0.8px; }
.ctab tbody tr.reg.cols:first-child td { border-top: 0; }
.ctab .post { font-weight: 700; color: var(--txt); white-space: nowrap; }
.ctab td.chg { box-shadow: inset 2px 0 0 var(--accent); }
.ctab .hold + .hold { margin-top: 7px; }
.ctab .dt { display: block; font-size: 10.5px; color: var(--txt-dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ctab .fr { font-size: 11px; color: var(--txt-dim); font-weight: 500; }
.ctab .nt { display: block; font-size: 10.5px; color: var(--txt-mid); font-style: italic; max-width: 220px; }
.ctab .bycm { color: var(--txt-dim); font-size: 11.5px; }
.ctab .gt { display: block; font-size: 10.5px; color: var(--txt-dim); }
.tview { overflow-x: auto; border: 1px solid var(--line); border-radius: 16px; background: var(--card); }
.ctab { width: 100%; min-width: 860px; border-collapse: collapse; font-size: 12.5px; }
.ctab th { text-align: left; font-size: 10px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: var(--txt-dim); padding: 12px 14px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: #121214; }
.ctab td { padding: 9px 14px; border-top: 1px solid rgba(255,255,255,0.04); vertical-align: top; }
.ctab tr.reg td { background: rgba(129,140,248,0.07); color: var(--accent); font-size: 11px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; padding: 8px 14px; border-top: 1px solid var(--line); }
.ctab tr.reg td span { color: var(--txt-dim); font-weight: 500; letter-spacing: 0.3px; text-transform: none; margin-left: 8px; }
.ctab tr.row { cursor: pointer; }
.ctab tr.row:hover td { background: rgba(255,255,255,0.03); }
.ctab tr.row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.ctab .st-n { font-weight: 700; color: var(--txt); white-space: nowrap; }
.ctab .st-s { font-size: 11px; color: var(--txt-dim); font-variant-numeric: tabular-nums; }
.ctab .yr { display: block; font-size: 10.5px; color: var(--txt-dim); font-variant-numeric: tabular-nums; }
.ctab .cmn { display: block; font-weight: 700; white-space: nowrap; }
.ctab .now { display: block; font-size: 11px; color: var(--txt-mid); white-space: nowrap; margin-top: 2px; }
.ctab .now b { font-weight: 700; }
.ctab .nolg { color: var(--txt-dim); font-style: italic; }

/* ── Election results ── */
.el-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 12px; }
.el-head .k { margin: 0; }
.el-sub { font-size: 11px; color: var(--txt-dim); }
.blocs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.bloc { font-size: 11px; color: var(--txt-mid); border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; }
.bloc b { color: var(--txt); font-variant-numeric: tabular-nums; }
.bloc.won { border-color: var(--accent-line); color: var(--txt); }
.sbar { position: relative; display: flex; gap: 2px; height: 22px; }
.sbar .s {
  min-width: 3px; display: flex; align-items: center; justify-content: center; overflow: hidden;
  font-size: 10px; font-weight: 800; letter-spacing: 0.3px; color: #0a0a0a; cursor: default;
}
.sbar .s:first-child { border-radius: 4px 0 0 4px; }
.sbar .s:last-child { border-radius: 0 4px 4px 0; }
.sbar .s:only-child { border-radius: 4px; }
.sbar .s:hover { filter: brightness(1.2); }
.maj { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--txt); border-radius: 1px; pointer-events: none; }
.maj-l { position: relative; height: 16px; margin-top: 4px; font-size: 10px; color: var(--txt-mid); }
.maj-l span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.plist { margin-top: 10px; display: flex; flex-direction: column; }
.prow { display: grid; grid-template-columns: 10px 58px 1fr auto; align-items: center; gap: 8px; padding: 5px 0; border-top: 1px solid rgba(255,255,255,0.04); font-size: 12px; }
.prow i { width: 10px; height: 10px; border-radius: 3px; }
.prow b { font-weight: 700; font-size: 11.5px; }
.prow span { color: var(--txt-mid); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow em { font-style: normal; font-weight: 700; font-variant-numeric: tabular-nums; }
.more { margin-top: 6px; }
.more summary { cursor: pointer; font-size: 11.5px; color: var(--accent); padding: 4px 0; list-style: none; }
.more summary::-webkit-details-marker { display: none; }
.more[open] summary { display: none; }
.strip { display: flex; gap: 2px; margin-bottom: 4px; }
.strip > div {
  flex: 1; min-width: 0; height: 38px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  color: #0a0a0a; line-height: 1.15; overflow: hidden; cursor: default;
}
.strip > div:first-child { border-radius: 4px 0 0 4px; }
.strip > div:last-child { border-radius: 0 4px 4px 0; }
.strip > div:hover { filter: brightness(1.15); }
.strip b { font-size: 11px; font-weight: 800; letter-spacing: 0.3px; white-space: nowrap; }
.strip span { font-size: 10px; font-weight: 600; opacity: 0.8; font-variant-numeric: tabular-nums; }
.hrow { display: grid; grid-template-columns: 40px 1fr auto; gap: 4px 10px; padding: 9px 0; border-top: 1px solid rgba(255,255,255,0.04); align-items: baseline; }
.hrow .y { font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums; }
.hrow .who { font-size: 13px; font-weight: 700; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hrow .who small { font-weight: 700; font-size: 10px; padding: 1px 6px; border-radius: 999px; color: #0a0a0a; margin-left: 6px; vertical-align: 1px; }
.hrow .res { font-size: 11.5px; color: var(--txt-mid); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.hrow .hbar { grid-column: 2 / 4; position: relative; display: flex; gap: 2px; height: 18px; margin-top: 2px; }
.hrow .hbar .s { font-size: 10px; justify-content: flex-start; padding: 0 6px; white-space: nowrap; }
.hrow .hbar .maj { top: -3px; bottom: -3px; }
.hrow .sub { grid-column: 2 / 4; font-size: 11px; color: var(--txt-dim); line-height: 1.4; }
.hrow .sub.flag { color: #e8b04a; }
.next { margin-top: 10px; font-size: 12px; color: var(--txt-mid); }
.next b { color: var(--txt); font-weight: 600; }
.lsh { display: grid; grid-template-columns: 40px 1fr; gap: 3px 10px; padding: 8px 0; border-top: 1px solid rgba(255,255,255,0.04); align-items: center; }
.lsh .y { font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums; }
.lsh .sbar { height: 14px; }
.lsh .sbar .s { font-size: 9px; }
.lsh .t { grid-column: 2; font-size: 11px; color: var(--txt-mid); font-variant-numeric: tabular-nums; }
.lsh .t em { font-style: normal; color: var(--txt-dim); }
.upg { padding: 9px 0; border-top: 1px solid rgba(255,255,255,0.04); display: grid; grid-template-columns: 86px 1fr; gap: 10px; align-items: baseline; }

.upg .who { display: flex; flex-wrap: wrap; gap: 5px; }

.upg button:hover, .upg button:focus-visible { border-color: var(--accent-line); color: var(--accent); outline: none; }
.upg .ls { color: var(--accent); font-weight: 600; font-size: 12px; }

}

}
</style>

<body>

<a class="back-link" href="portals.html">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
  </svg>
  Hub
</a>

<div class="page">
  <header class="header">
    <div>
      <h1 class="title">India</h1>
      <p class="subtitle" id="subtitle">States, capitals and who governs them</p>
    </div>
    <div class="toolbar">
      <div class="seg" role="group" aria-label="View">
        <button id="view-map" class="on" aria-pressed="true">Map</button>
        <button id="view-table" aria-pressed="false">CMs</button>
        <button id="view-gov" aria-pressed="false">Government</button>
        <button id="view-ts" aria-pressed="false">Telangana</button>
      </div>
      <button class="chip-btn map-only" id="india-btn">All India</button>
      <div class="seg map-only" role="group" aria-label="Colour the map by">
        <button id="mode-party" class="on" aria-pressed="true">CM party</button>
        <button id="mode-ls" aria-pressed="false">Lok Sabha '24</button>
        <button id="mode-hist" aria-pressed="false" hidden>Power changes</button>
        <button id="mode-plain" aria-pressed="false">States</button>
      </div>
      <button class="chip-btn on map-only" id="caps-btn" aria-pressed="true">Capitals</button>
      <select class="jump map-only" id="jump" aria-label="Jump to a state or union territory">
        <option value="">Jump to…</option>
      </select>
    </div>
  </header>

  <div class="legend" id="legend"></div>

  <div class="stage" id="stage">
    <div class="map-wrap" id="map-wrap"></div>
    <aside class="detail" id="detail" aria-live="polite"><div class="detail-inner" id="detail-inner"></div></aside>
  </div>

  <div class="tview" id="tview" hidden></div>
  <div class="gview" id="gview" hidden></div>
  <div class="tsview" id="tsview" hidden></div>

  <p class="foot" id="foot"></p>
</div>

<div class="tip" id="tip"></div>

<script>
if (window.self !== window.top) document.documentElement.classList.add('embedded');

const NS = 'http://www.w3.org/2000/svg';
const LS_TOTAL = 543, RS_ELECTED = 233;
const PLAIN = ['#3b4a6b', '#4a3b6b', '#3b6b5e', '#6b5a3b', '#5e3b6b', '#3b5e6b', '#6b3b4f', '#4f6b3b'];
const NO_LEG = '#2a2d33';
const FOLD = '#5b6170';
const BLOC_COL = { NDA: '#e0701f', INDIA: '#3b7fe0', Split: '#8a6fc0', Others: FOLD };
// Sequential ramp for "power changes": more changes reads brighter on the dark surface.
const TURN = ['#262a4d', '#36407f', '#4b58b0', '#6f7fe0', '#aab4ff'];
const PM = { name: 'Narendra Modi', party: 'BJP', since: '2014-05-26' };
const SMALL_AREA = 1300;
// Tiny UTs get an outside label joined by a leader line: [dx, dy] from their centre.
const CALLOUT = {
  'Delhi': [40, -22],
  'Dadra and Nagar Haveli and Daman and Diu': [-56, 10],
  'Puducherry': [44, 10],
  'Lakshadweep': [-30, 0],
  'Goa': [-40, 6],
};
// Chandigarh's dot already carries its name, so it gets no separate area label.
const NO_LABEL = new Set(['Chandigarh']);
const NUDGE = { Punjab: [-10, 16] };
// Capital labels that would collide with a state label: l = left of the dot, b = below it.
const CAP_POS = { Dehradun: 'l', Agartala: 'l', Chandigarh: 'l', Imphal: 'b', Shillong: 'b', Kohima: 'b' };

let MAP, DATA, EL, GOV, TS, byName = {}, selected = null, mode = 'party';
const el = (tag, attrs = {}, parent) => {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function project([lat, lon]) {
  const p = MAP.proj, c = Math.cos(p.lat0 * Math.PI / 180);
  return [(lon * c - p.x0) * p.k + p.pad, (-lat - p.y0) * p.k + p.pad];
}

function fillFor(st) {
  if (mode === 'plain') return PLAIN[st.geo.colour % PLAIN.length];
  if (mode === 'ls') return BLOC_COL[lsWinner(st.name)] + 'b3';
  if (mode === 'hist') { const t = turnover(st.name); return t ? TURN[t.changes] : NO_LEG; }
  if (!st.party) return NO_LEG;
  return DATA.parties[st.party].color + 'b3';
}

function buildMap() {
  const svg = el('svg', { viewBox: `0 0 ${MAP.width} ${MAP.height}`, role: 'img', 'aria-label': 'Map of India by state and union territory' });
  const gStates = el('g', {}, svg), gLeaders = el('g', {}, svg), gCaps = el('g', {}, svg), gLabels = el('g', {}, svg), gHits = el('g', {}, svg);

  MAP.states.forEach((g, i) => {
    const st = byName[g.name];
    st.geo = g;
    const p = el('path', { d: g.d, class: 'st', tabindex: 0, role: 'button', 'aria-label': `${g.name}, capital ${st.capital}` }, gStates);
    p.style.fill = fillFor(st);
    st.path = p;
    p.addEventListener('click', () => select(g.name));
    p.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(g.name); } });
    p.addEventListener('mousemove', e => showTip(e, st));
    p.addEventListener('mouseleave', hideTip);

    let [x, y] = g.label;
    const off = CALLOUT[g.name];
    const small = g.area < SMALL_AREA;
    if (g.area < 200) {
      const h = el('circle', { cx: x, cy: y, r: 9, class: 'hit' }, gHits);
      h.addEventListener('click', () => select(g.name));
      h.addEventListener('mousemove', e => showTip(e, st));
      h.addEventListener('mouseleave', hideTip);
    }
    if (NO_LABEL.has(g.name)) return;
    if (NUDGE[g.name]) { x += NUDGE[g.name][0]; y += NUDGE[g.name][1]; }
    if (off) {
      el('line', { x1: x, y1: y, x2: x + off[0] * 0.8, y2: y + off[1] * 0.8, class: 'leader' }, gLeaders);
      x += off[0]; y += off[1];
    }
    const size = small ? 11 : Math.max(11, Math.min(20, Math.sqrt(g.area) / 7.5));
    const t = el('text', { x, y, class: 'lbl' + (small ? ' small' : ''), 'font-size': size.toFixed(1) }, gLabels);
    t.textContent = small ? st.abbr : g.name;
  });

  DATA.states.filter(s => s.cap).forEach(s => {
    const [x, y] = project(s.cap);
    el('circle', { cx: x, cy: y, r: 3, class: 'cap-dot' }, gCaps);
    const pos = CAP_POS[s.capital];
    const t = pos === 'l' ? el('text', { x: x - 5, y: y + 3.5, class: 'cap-lbl l' }, gCaps)
            : pos === 'b' ? el('text', { x: x - 4, y: y + 13, class: 'cap-lbl' }, gCaps)
            : el('text', { x: x + 5, y: y + 3.5, class: 'cap-lbl' }, gCaps);
    t.textContent = s.capital;
  });

  document.getElementById('map-wrap').appendChild(svg);
}

function recolour() {
  DATA.states.forEach(s => { s.path.style.fill = fillFor(s); });
  const lg = document.getElementById('legend');
  lg.innerHTML = '';
  if (mode === 'ls') {
    const c = {};
    DATA.states.forEach(s => { const w = lsWinner(s.name); c[w] = (c[w] || 0) + 1; });
    [['NDA', 'NDA won most seats'], ['INDIA', 'INDIA won most seats'], ['Split', 'Tied'], ['Others', 'Others won most']].forEach(([k, label]) => {
      if (c[k]) lg.insertAdjacentHTML('beforeend', `<span><i style="background:${BLOC_COL[k]}"></i>${label} · ${c[k]}</span>`);
    });
    return;
  }
  if (mode === 'hist') {
    const c = [0, 0, 0, 0, 0];
    DATA.states.forEach(s => { const t = turnover(s.name); if (t) c[t.changes]++; });
    const lbl = ['Never changed', '1 change', '2 changes', '3 changes', 'Changed every time'];
    c.forEach((n, i) => { if (n) lg.insertAdjacentHTML('beforeend', `<span><i style="background:${TURN[i]}"></i>${lbl[i]} · ${n}</span>`); });
    lg.insertAdjacentHTML('beforeend', `<span style="color:var(--txt-dim)">Party of the CM after each of the last 5 Assembly elections</span>`);
    return;
  }
  if (mode !== 'party') return;
  const counts = {};
  DATA.states.forEach(s => { if (s.party) counts[s.party] = (counts[s.party] || 0) + 1; });
  Object.keys(counts).sort((a, b) => counts[b] - counts[a] || a.localeCompare(b)).forEach(k => {
    lg.insertAdjacentHTML('beforeend', `<span><i style="background:${DATA.parties[k].color}"></i>${esc(k)} · ${counts[k]}</span>`);
  });
  lg.insertAdjacentHTML('beforeend', `<span><i style="background:${NO_LEG};border:1px solid #444"></i>No legislature</span>`);
}

function showTip(e, st) {
  const tip = document.getElementById('tip');
  let extra = st.cm ? `<small>CM: ${esc(st.cm)} (${esc(st.party)})</small>` : '';
  if (mode === 'hist') {
    const t = turnover(st.name);
    extra = t ? `<small>${t.seq.map(e => `${e.year} ${esc(e.cmParty)}`).join(' → ')}</small>` : '<small>No legislature</small>';
  } else if (mode === 'ls') {
    extra = `<small>Lok Sabha 2024: ${lsRows(st.name).map(r => `${esc(r.party)} ${r.seats}`).join(', ')}</small>`;
  }
  tip.innerHTML = `<b>${esc(st.name)}</b><small>Capital: ${esc(st.capital)}</small>${extra}`;
  const w = tip.offsetWidth;
  tip.style.left = Math.min(e.clientX + 14, window.innerWidth - w - 8) + 'px';
  tip.style.top = (e.clientY + 14) + 'px';
  tip.classList.add('show');
}
function hideTip() { document.getElementById('tip').classList.remove('show'); }

function fmtDate(iso) {
  return new Date(iso + 'T00:00:00').toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
}
function tenure(iso) {
  const a = new Date(iso + 'T00:00:00'), b = new Date();
  let m = (b.getFullYear() - a.getFullYear()) * 12 + b.getMonth() - a.getMonth();
  if (b.getDate() < a.getDate()) m--;
  const y = Math.floor(m / 12); m %= 12;
  if (y <= 0 && m <= 0) return 'under a month';
  return [y && `${y} yr`, m && `${m} mo`].filter(Boolean).join(' ');
}

function seat(n, label, extra, share) {
  if (!n) return `<div class="seat none"><div class="seat-n">—</div><div class="seat-l">${label}</div></div>`;
  return `<div class="seat"><div class="seat-n">${n}${extra ? ` <small>${extra}</small>` : ''}</div><div class="seat-l">${label}</div>${share != null ? `<div class="share"><i style="width:${Math.max(1, share * 100).toFixed(1)}%"></i></div>` : ''}</div>`;
}

const pcol = code => (DATA.parties[code] && DATA.parties[code].color) || FOLD;
const pname = code => (DATA.parties[code] && DATA.parties[code].name) || code;
const lsBloc = code => EL.lokSabha.blocs.NDA.includes(code) ? 'NDA' : EL.lokSabha.blocs.INDIA.includes(code) ? 'INDIA' : null;

function lsRows(name) {
  return (EL.lokSabha.states[name] || []).map(r => ({ ...r, bloc: lsBloc(r.party) }));
}
function lsWinner(name) {
  const t = { NDA: 0, INDIA: 0, Others: 0 };
  lsRows(name).forEach(r => { t[r.bloc || 'Others'] += r.seats; });
  const top = Math.max(t.NDA, t.INDIA, t.Others);
  if (t.NDA === top && t.INDIA === top) return 'Split';
  return t.NDA === top ? 'NDA' : t.INDIA === top ? 'INDIA' : 'Others';
}

// Alliances stay contiguous in the bar and list; independents and "others" go last.
function ordered(rows) {
  const blocTot = {};
  rows.forEach(r => { if (r.bloc) blocTot[r.bloc] = (blocTot[r.bloc] || 0) + r.seats; });
  const last = r => !r.bloc && (r.party === 'IND' || r.party === 'OTH') ? 1 : 0;
  const group = r => r.bloc ? blocTot[r.bloc] : r.seats;
  return rows.slice().sort((a, b) => last(a) - last(b) || group(b) - group(a) || (a.bloc || a.party).localeCompare(b.bloc || b.party) || b.seats - a.seats);
}

function seatBar(rows, total, majority, colourOf = r => pcol(r.party), labelOf = r => r.party, tipOf = r => `${pname(r.party)} · ${r.seats}`) {
  const segs = rows.map(r =>
    `<span class="s" style="flex:${r.seats} 0 0;background:${colourOf(r)}" data-tip="${esc(tipOf(r))}">${r.seats / total >= 0.08 ? esc(labelOf(r)) : ''}</span>`
  ).join('');
  const pos = (majority / total * 100).toFixed(2);
  return `<div class="sbar" role="img" aria-label="${esc(rows.map(r => `${labelOf(r)} ${r.seats}`).join(', '))}">${segs}${majority ? `<i class="maj" style="left:${pos}%"></i>` : ''}</div>` +
    (majority ? `<div class="maj-l"><span style="left:${Math.min(85, Math.max(15, pos))}%">Majority · ${majority}</span></div>` : '');
}

function blocChips(rows, majority) {
  const t = {};
  rows.forEach(r => { if (r.bloc) t[r.bloc] = (t[r.bloc] || 0) + r.seats; });
  const keys = Object.keys(t).sort((a, b) => t[b] - t[a]);
  if (!keys.length) return '';
  return `<div class="blocs">${keys.map(k => `<span class="bloc${majority && t[k] >= majority ? ' won' : ''}">${esc(k)} <b>${t[k]}</b></span>`).join('')}</div>`;
}

function partyList(rows, showBloc, limit = 8) {
  const row = r => `<div class="prow"><i style="background:${pcol(r.party)}"></i><b>${esc(r.party)}</b><span>${esc(pname(r.party))}${showBloc && r.bloc ? ` · ${esc(r.bloc)}` : ''}</span><em>${r.seats}</em></div>`;
  const head = rows.slice(0, limit).map(row).join('');
  const rest = rows.slice(limit);
  return `<div class="plist">${head}${rest.length ? `<details class="more"><summary>+ ${rest.length} more</summary>${rest.map(row).join('')}</details>` : ''}</div>`;
}

function electionCard(title, sub, rows, total, majority) {
  const o = ordered(rows);
  return `<div class="card">
    <div class="el-head"><div class="k">${title}</div><div class="el-sub">${sub}</div></div>
    ${blocChips(o, majority)}
    ${seatBar(o, total, majority)}
    ${partyList(o, true)}
  </div>`;
}

function renderIndia() {
  const tot = {};
  Object.values(EL.lokSabha.states).flat().forEach(r => { tot[r.party] = (tot[r.party] || 0) + r.seats; });
  const rows = Object.entries(tot).map(([party, seats]) => ({ party, seats, bloc: lsBloc(party) }));
  const total = EL.lokSabha.total, maj = Math.floor(total / 2) + 1;
  const b = { NDA: 0, INDIA: 0, Others: 0 };
  rows.forEach(r => { b[r.bloc || 'Others'] += r.seats; });
  const blocRows = ['NDA', 'INDIA', 'Others'].map(k => ({ party: k, seats: b[k] }));
  document.getElementById('detail-inner').innerHTML = `
    <div class="card d-head wide">
      <button class="close" id="close" aria-label="Close">✕</button>
      <div class="d-type">Country</div>
      <div class="d-name">India</div>
      <div class="pm">Prime Minister · <b>${esc(PM.name)}</b> (${esc(PM.party)}) since ${fmtDate(PM.since)}</div>
    </div>
    <div class="card">
      <div class="el-head"><div class="k">Lok Sabha ${EL.lokSabha.year} · by alliance</div><div class="el-sub">${total} seats</div></div>
      ${seatBar(blocRows, total, maj, r => BLOC_COL[r.party], r => `${r.party} ‧ ${r.seats}`, r => `${r.party} · ${r.seats} seats`)}
      <div class="plist">${blocRows.map(r => `<div class="prow"><i style="background:${BLOC_COL[r.party]}"></i><b>${r.party}</b><span>${r.party === 'NDA' ? 'National Democratic Alliance' : r.party === 'INDIA' ? 'Indian National Developmental Inclusive Alliance' : 'Unaligned parties and independents'}</span><em>${r.seats}</em></div>`).join('')}</div>
    </div>
    <div class="card">
      <div class="el-head"><div class="k">Lok Sabha ${EL.lokSabha.year} · by party</div><div class="el-sub">${rows.length} parties</div></div>
      ${partyList(rows.slice().sort((a, b) => (a.party === 'IND') - (b.party === 'IND') || b.seats - a.seats || a.party.localeCompare(b.party)), true, 10)}
    </div>
    ${upcomingCard()}
    ${lsHistoryCard()}
    <div class="card note wide">Alliances are as they stood at the ${EL.lokSabha.year} election. Click a state for its own Lok Sabha and Assembly results.</div>`;
  document.getElementById('close').addEventListener('click', close);
  document.querySelectorAll('[data-state]').forEach(b => b.addEventListener('click', () => select(b.dataset.state)));
}

function renderDetail(st) {
  const party = st.party && DATA.parties[st.party];
  const cmBlock = st.cm ? `
    <div class="card">
      <div class="k">Chief Minister</div>
      <div class="cm-name">${esc(st.cm)}</div>
      <div class="party">
        <span class="pill" style="background:${party.color}">${esc(st.party)}</span>
        <span class="party-full">${esc(party.name)}</span>
        ${party.alliance !== 'Other' ? `<span class="alliance">${esc(party.alliance)}</span>` : ''}
      </div>
      <div class="since">In office since ${fmtDate(st.since)} · ${tenure(st.since)}</div>
      ${nextLine(st.name)}
    </div>` : `
    <div class="card">
      <div class="k">Chief Minister</div>
      <div class="no-cm">No Chief Minister — this union territory has no legislature and is run by the ${esc(st.admin)}, appointed by the President.</div>
    </div>`;

  // Fixed slots (MLAs, MLCs / Lok Sabha, Rajya Sabha) so each number is always in the same place; missing ones stay as dashed placeholders.
  const seats = [
    seat(st.mla, st.mla ? 'MLAs — Legislative Assembly seats' : 'MLAs — no Legislative Assembly', st.mlaNominated ? `+${st.mlaNominated} nominated` : ''),
    seat(st.mlc, st.mlc ? 'MLCs — Legislative Council seats' : 'MLCs — no Legislative Council'),
    seat(st.ls, `Lok Sabha MPs · ${(st.ls / LS_TOTAL * 100).toFixed(1)}% of ${LS_TOTAL}`, '', st.ls / LS_TOTAL),
    seat(st.rs, st.rs ? `Rajya Sabha MPs · of ${RS_ELECTED} elected` : 'Rajya Sabha MPs — no seats', '', st.rs / RS_ELECTED),
  ];

  document.getElementById('detail-inner').innerHTML = `
    <div class="card d-head wide">
      <button class="close" id="close" aria-label="Close">✕</button>
      <div class="d-type">${st.type === 'ut' ? 'Union territory' : 'State'}</div>
      <div class="d-name">${esc(st.name)}</div>
      <div class="d-cap">Capital · <b>${esc(st.capital)}</b></div>
    </div>
    ${cmBlock}
    <div class="card">
      <div class="k">Seats</div>
      <div class="seats">${seats.join('')}</div>
    </div>
    ${electionCards(st)}
    ${st.note ? `<div class="card note wide">${esc(st.note)}</div>` : ''}`;
  document.getElementById('close').addEventListener('click', close);
}

function electionCards(st) {
  let html = '';
  const a = EL.assembly[st.name];
  if (a) html += electionCard(`Assembly election · ${a.year}`, `${a.total} seats`, a.results, a.total, Math.floor(a.total / 2) + 1) + (historyCard(st.name) || '<div></div>');
  const ls = lsRows(st.name);
  if (ls.length) html += electionCard(`Lok Sabha ${EL.lokSabha.year}`, `${st.ls} seat${st.ls > 1 ? 's' : ''} from here`, ls, st.ls, 0) + (lsStateHistoryCard(st.name) || '<div></div>');
  return html;
}

function turnover(name) {
  const h = EL.assemblyHistory[name];
  if (!h) return null;
  const seq = h.slice().reverse();
  let changes = 0;
  for (let i = 1; i < seq.length; i++) if (seq[i].cmParty !== seq[i - 1].cmParty) changes++;
  return { seq, changes };
}

function monthsUntil(ym) {
  const [y, m] = ym.split('-').map(Number), now = new Date();
  return (y - now.getFullYear()) * 12 + (m - 1 - now.getMonth());
}
function nextLine(name) {
  const u = EL.upcoming.assembly[name];
  if (!u) return '';
  const m = monthsUntil(u.due);
  const away = m <= 1 ? 'any time now' : m < 24 ? `in about ${m} months` : `in about ${Math.round(m / 12)} years`;
  return `<div class="next">Next Assembly election · <b>${esc(u.label)}</b> <span style="color:var(--txt-dim)">(${away})</span></div>`;
}

function lsStateHistoryCard(name) {
  const h = EL.lokSabhaStateHistory[name];
  if (!h || h.length < 2) return '';
  const rows = h.map(e => {
    const r = e.results.map(([party, seats]) => ({ party, seats })).sort((a, b) => (a.party === 'IND') - (b.party === 'IND') || b.seats - a.seats);
    const text = r.slice(0, 3).map(x => `${esc(x.party)} ${x.seats}`).join(' · ') + (r.length > 3 ? ` · +${r.length - 3} more` : '');
    return `<div class="lsh"><div class="y">${e.year}</div>${seatBar(r, e.total, 0)}<div class="t">${text}${e.note ? ` <em>— ${esc(e.note)}</em>` : ''}</div></div>`;
  }).join('');
  return `<div class="card">
    <div class="el-head"><div class="k">Lok Sabha · last ${h.length} elections</div><div class="el-sub">MPs from here</div></div>
    ${rows}
  </div>`;
}

function upcomingCard() {
  const groups = {};
  Object.entries(EL.upcoming.assembly).forEach(([name, u]) => { (groups[u.due] = groups[u.due] || { label: u.label, names: [] }).names.push(name); });
  const ls = EL.upcoming.lokSabha;
  const keys = Object.keys(groups).concat(ls.due).filter((v, i, a) => a.indexOf(v) === i).sort();
  const rows = keys.map(k => {
    const g = groups[k];
    const who = (g ? g.names.sort().map(n => `<button data-state="${esc(n)}">${esc(n)}</button>`).join('') : '') +
      (k === ls.due ? `<span class="ls">Lok Sabha general election</span>` : '');
    return `<div class="upg"><div class="when">${esc(g ? g.label : ls.label)}</div><div class="who">${who}</div></div>`;
  }).join('');
  return `<div class="card">
    <div class="el-head"><div class="k">Upcoming elections</div><div class="el-sub">Expected</div></div>
    ${rows}
    <div class="el-sub" style="margin-top:8px">${esc(EL.upcoming.note)}</div>
  </div>`;
}

// Names wear their party's hue, lifted toward white so they stay readable on the dark card.
function partyName(name, code) {
  return `<div class="who" style="color:color-mix(in oklab, ${pcol(code)} 62%, #fff)" data-tip="${esc(name)} · ${esc(pname(code))}">${esc(name)}</div>`;
}

// Two largest parties plus everyone else, on the house's own scale, with a majority tick.
function historyBar(e) {
  const segs = e.largest.map(([party, seats]) => ({ party, seats, col: pcol(party), label: party, tip: `${pname(party)} · ${seats}` }));
  const rest = e.total - segs.reduce((n, x) => n + x.seats, 0);
  if (rest > 0) segs.push({ party: 'Others', seats: rest, col: FOLD, label: 'Others', tip: `All other parties and independents · ${rest}` });
  const maj = Math.floor(e.total / 2) + 1;
  const html = segs.filter(x => x.seats > 0).map(x => {
    const share = x.seats / e.total;
    const room = x.party === 'Others' ? 0.3 : 0.16;
    const text = share >= room ? `${x.label} ‧ ${x.seats}` : share >= 0.06 ? `${x.seats}` : '';
    return `<span class="s" style="flex:${x.seats} 0 0;background:${x.col}" data-tip="${esc(x.tip)} of ${e.total}">${esc(text)}</span>`;
  }).join('');
  return `<div class="hbar sbar" role="img" aria-label="${esc(segs.map(x => `${x.label} ${x.seats}`).join(', '))} of ${e.total}">${html}<i class="maj" style="left:${(maj / e.total * 100).toFixed(2)}%" data-tip="Majority · ${maj}"></i></div>`;
}

function historyCard(name) {
  const h = EL.assemblyHistory[name];
  if (!h) return '';
  const oldestFirst = h.slice().reverse();
  const strip = `<div class="strip" role="img" aria-label="${esc(oldestFirst.map(e => `${e.year} ${e.cmParty}`).join(', '))}">${oldestFirst.map(e =>
    `<div style="background:${pcol(e.cmParty)}" data-tip="${e.year} · ${esc(e.cm)} (${esc(pname(e.cmParty))})"><b>${esc(e.cmParty)}</b><span>${e.year}</span></div>`).join('')}</div>`;
  const rows = h.map(e => {
    const [top, second] = e.largest;
    const flag = top[0] !== e.cmParty && !(second && second[1] === top[1] && second[0] === e.cmParty);
    const sub = [flag ? `Largest party ${top[0]} didn’t form the government` : '', e.note || ''].filter(Boolean).join(' · ');
    return `<div class="hrow">
      <div class="y">${e.year}</div>
      ${partyName(e.cm, e.cmParty)}
      <div class="res">${e.total} seats</div>
      ${historyBar(e)}
      ${sub ? `<div class="sub${flag ? ' flag' : ''}">${esc(sub)}</div>` : ''}
    </div>`;
  }).join('');
  return `<div class="card">
    <div class="el-head"><div class="k">Last ${h.length} Assembly elections</div><div class="el-sub">CM after each election</div></div>
    ${strip}
    <div style="margin-top:10px">${rows}</div>
  </div>`;
}

function lsHistoryCard() {
  const BCOL = { NDA: BLOC_COL.NDA, UPA: BLOC_COL.INDIA, INDIA: BLOC_COL.INDIA };
  const oldestFirst = EL.lokSabhaHistory.slice().reverse();
  const strip = `<div class="strip">${oldestFirst.map(e =>
    `<div style="background:${BCOL[e.winner]}" data-tip="${e.year} · ${e.winner} ${e.blocs[0][1]} seats · PM ${esc(e.pm)}"><b>${e.winner}</b><span>${e.year}</span></div>`).join('')}</div>`;
  const rows = EL.lokSabhaHistory.map(e => `<div class="hrow">
      <div class="y">${e.year}</div>
      ${partyName(e.pm, e.pmParty)}
      <div class="res">${e.blocs.map(([b, n]) => `${b} ${n}`).join(' · ')}</div>
      <div class="sub">${e.parties.map(([p, n]) => `${p} ${n}`).join(' · ')} — largest two parties</div>
    </div>`).join('');
  return `<div class="card">
    <div class="el-head"><div class="k">Last ${EL.lokSabhaHistory.length} Lok Sabha elections</div><div class="el-sub">PM after each election</div></div>
    ${strip}
    <div style="margin-top:10px">${rows}</div>
  </div>`;
}

const tint = code => `color-mix(in oklab, ${pcol(code)} 62%, #fff)`;

// Regions by total Lok Sabha seats, and states within each by their own seats.
function byRegion() {
  const regions = {};
  DATA.states.forEach(s => (regions[s.region] = regions[s.region] || []).push(s));
  return Object.keys(regions).map(r => {
    const list = regions[r].slice().sort((a, b) => b.ls - a.ls || a.name.localeCompare(b.name));
    return { region: r, list, seats: list.reduce((n, s) => n + s.ls, 0) };
  }).sort((a, b) => b.seats - a.seats);
}

function tipHandlers(el) {
  el.addEventListener('mousemove', e => {
    const t = e.target.closest('[data-tip]');
    if (!t) return hideTip();
    const tip = document.getElementById('tip');
    tip.textContent = t.dataset.tip;
    tip.style.left = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8) + 'px';
    tip.style.top = (e.clientY + 14) + 'px';
    tip.classList.add('show');
  });
  el.addEventListener('mouseleave', hideTip);
}

function stateRowLinks(el) {
  el.querySelectorAll('tr.row').forEach(tr => {
    const go = () => { setView('map'); select(tr.dataset.state); };
    tr.addEventListener('click', go);
    tr.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  });
}

const monYr = d => new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { month: 'short', year: 'numeric' });
const stateCell = s => `<td><div class="st-n">${esc(s.name)}</div><div class="st-s">${s.ls} Lok Sabha seat${s.ls > 1 ? 's' : ''}</div></td>`;

function buildGov() {
  const P = GOV.people, label = Object.fromEntries(GOV.posts);
  const who = name => `<span class="cmn" style="color:${tint(P[name].party)}" data-tip="${esc(name)} · ${esc(pname(P[name].party))} · ${esc(P[name].seat)}">${esc(name)}</span>`;
  const now = GOV.union[0];
  const cards = GOV.posts.map(([k, l]) => {
    const x = now.posts[k][now.posts[k].length - 1], p = P[x.name];
    return `<div class="ucard"><div class="k">${esc(l)}</div>
      <div class="n" style="color:${tint(p.party)}" data-tip="${esc(x.name)} · ${esc(pname(p.party))}">${esc(x.name)}</div>
      <div class="f">From <b>${esc(p.from)}</b></div>
      <div class="m">${esc(p.seat)}</div>
      <div class="m">Since ${fmtDate(x.since)}${p.note ? ` · ${esc(p.note)}` : ''}</div></div>`;
  }).join('');

  const head = `<tr><th>Post</th>${GOV.union.map(g => `<th>${g.year} · ${esc(g.label)}</th>`).join('')}</tr>`;
  const rows = GOV.posts.map(([k, l]) => `<tr><td class="post">${esc(l)}</td>${GOV.union.map(g => {
    const hs = g.posts[k], many = hs.length > 1;
    const body = hs.map(x => `<div class="hold">${who(x.name)}<span class="fr">${esc(P[x.name].from)}</span>${
      many ? `<span class="dt">${monYr(x.since)} – ${x.until ? monYr(x.until) : 'now'}</span>` : ''}${x.note ? `<span class="nt">${esc(x.note)}</span>` : ''}</div>`).join('');
    return `<td${many ? ' class="chg"' : ''}>${body}</td>`;
  }).join('')}</tr>`).join('');

  const N = 5;
  const pick = (s, v) => {
    if (v === 'cm') return `<span class="bycm">Held by the CM</span>`;
    if (v === 'lg') return `<span class="bycm">With the Lt Governor</span>`;
    return `<span class="cmn" style="color:${tint(v.party)}" data-tip="${esc(v.name)} · ${esc(pname(v.party))}">${esc(v.name)}</span>`;
  };
  const cols = ['Governor / LG', 'Chief Minister', 'Deputy CM', 'Home', 'Finance'];
  const sbody = byRegion().map(({ region, list, seats }) => `<tr class="reg cols"><td>${esc(region)}<span>${list.length} states & UTs · ${seats} Lok Sabha seats</span></td>${cols.map(c => `<td><i>${c}</i></td>`).join('')}</tr>` + list.map(s => {
    const g = GOV.states[s.name] || {};
    const head = g.head ? `<span class="gt">${esc(g.head.title)}</span><span class="cmn" style="color:var(--txt)" data-tip="Since ${fmtDate(g.head.since)}">${esc(g.head.name)}</span>` : '';
    const note = g.note ? `<span class="nt">${esc(g.note)}</span>` : '';
    if (!s.cm) return `<tr class="row" tabindex="0" data-state="${esc(s.name)}">${stateCell(s)}<td>${head}</td><td colspan="${N - 1}" class="nolg">No legislature — the ${esc(g.head ? g.head.title : 'Administrator')} runs it for the Union${note ? ' · ' + esc(g.note) : ''}</td></tr>`;
    const dep = g.deputy && g.deputy.length ? g.deputy.map(d => `<div class="hold">${pick(s, d)}</div>`).join('') : '<span class="bycm">—</span>';
    return `<tr class="row" tabindex="0" data-state="${esc(s.name)}">${stateCell(s)}<td>${head}</td>
      <td><span class="cmn" style="color:${tint(s.party)}" data-tip="${esc(s.cm)} · ${esc(pname(s.party))}">${esc(s.cm)}</span></td>
      <td>${dep}</td><td>${pick(s, g.home)}${note}</td><td>${pick(s, g.finance)}</td></tr>`;
  }).join('')).join('');

  const gv = document.getElementById('gview');
  gv.innerHTML = `
    <section class="gsec"><h2>Union Government · now</h2><p class="gsub">The Prime Minister and the four ministries that sit on the Cabinet Committee on Security. “From” is the state they come from; the seat line is the house and state that sends them to Parliament.</p><div class="ucards">${cards}</div></section>
    <section class="gsec"><h2>Top five posts · last five governments</h2><p class="gsub">Each column is the government formed after that Lok Sabha election. A marked cell means the post changed hands mid-term, with dates.</p>
      <div class="tview"><table class="ctab fixed"><colgroup><col style="width:130px">${GOV.union.map(() => '<col>').join('')}</colgroup><thead>${head}</thead><tbody>${rows}</tbody></table></div></section>
    <section class="gsec"><h2>States · top posts now</h2><p class="gsub">Grouped by region, most Lok Sabha seats first. “Held by the CM” means the Chief Minister keeps that department.</p>
      <div class="tview"><table class="ctab"><tbody>${sbody}</tbody></table></div></section>`;
  stateRowLinks(gv);
  tipHandlers(gv);
}

const TAG_COL = { Background: '#8a8f98', Election: '#818cf8', Government: '#3b9e8f', Courts: '#d4a03a', Probe: '#e0605a', Party: '#b07ad6' };

function buildTelangana() {
  const T = TS, monthYr = d => new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { month: 'short', year: 'numeric' });
  const SPECIAL = {
    XBRS: `repeating-linear-gradient(135deg, ${pcol('INC')} 0 5px, ${pcol('BRS')} 5px 10px)`,
    RAJA: FOLD, VAC: 'rgba(255,255,255,0.10)', OTH: FOLD,
  };
  const col = c => SPECIAL[c] || pcol(c);
  const score = T.scoreboard.map(b => {
    const rows = b.rows.map(([party, seats, label, tip]) => ({ party, seats, label: label === undefined ? party : label, tip: tip || `${pname(party)} · ${seats}` }));
    const bar = seatBar(rows, b.total, b.majority, r => col(r.party), r => r.label ? `${r.label} ‧ ${r.seats}` : '', r => r.tip);
    const keys = rows.map(r => `<span><i style="background:${col(r.party)}"></i>${esc(r.label || r.tip.split(' · ')[0])} <b>${r.seats.toLocaleString('en-IN')}</b></span>`).join('');
    return `<div class="card"><div class="t"><b>${esc(b.title)}</b><span>${esc(b.when)} · ${b.total.toLocaleString('en-IN')} seats</span></div>${bar}<div class="keys">${keys}</div><div class="ts-note">${esc(b.note)}</div></div>`;
  }).join('');
  const nameIn = (n, c) => `<div class="n" style="color:${c ? tint(c) : 'var(--txt)'}">${esc(n)}</div>`;
  const gov = T.government.top.map(([k, n, c, m]) => `<div class="ucard"><div class="k">${esc(k)}</div>${nameIn(n, c)}<div class="m">${esc(m)}</div></div>`).join('');
  const mins = T.government.ministers.map(([n, d]) => `<div><b>${esc(n)}</b><span>${esc(d)}</span></div>`).join('');
  const parties = T.parties.map(p => `<div class="ts-party" style="--pc:${p.code ? pcol(p.code) : FOLD}"><h3>${esc(p.name)}</h3><div class="st">${esc(p.stance)}</div>${
    p.people.map(([n, r]) => `<div class="p"><b>${esc(n)}</b><span>${esc(r)}</span></div>`).join('')}</div>`).join('');
  let lastYr = '';
  const tl = T.timeline.map(e => {
    const yr = e.date.slice(0, 4), bg = e.tag === 'Background';
    const head = !bg && yr !== lastYr ? `<div class="ts-yr">${yr}</div>` : '';
    if (!bg) lastYr = yr;
    return `${head}<div class="ts-ev${bg ? ' bg' : ''}" style="--tc:${TAG_COL[e.tag] || FOLD}"><div class="d">${monthYr(e.date)}</div><div class="g">${esc(e.tag)}</div><div><h4>${esc(e.title)}</h4><p>${esc(e.text)}</p></div></div>`;
  }).join('');
  const list = rows => rows.map(([k, v]) => `<div class="ts-li"><b>${esc(k)}</b>${esc(v)}</div>`).join('');
  const el = document.getElementById('tsview');
  el.innerHTML = `
    <section class="gsec"><h2>Telangana · the story so far</h2><div class="ts-intro">${T.intro.map(p => `<p>${esc(p)}</p>`).join('')}</div></section>
    <section class="gsec"><h2>Scoreboard</h2><p class="gsub">Every vote since the 2023 Assembly election, oldest first. The Assembly majority is 60 of 119.</p><div class="ts-score">${score}</div></section>
    <section class="gsec"><h2>Who runs the state</h2><p class="gsub">${esc(T.government.note)} The Governor is the formal head; the CM holds the power.</p><div class="ts-gov">${gov}</div>
      <div class="card" style="margin-top:10px"><div class="k" style="font-size:10px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--txt-dim)">Key ministers</div><div class="ts-mins">${mins}</div></div></section>
    <section class="gsec"><h2>Who heads whom · the parties</h2><p class="gsub">The person who runs a party isn’t always the one in government. Congress decides in Delhi; BRS decides in KCR’s house.</p><div class="ts-parties">${parties}</div></section>
    <section class="gsec"><h2>What happened</h2><p class="gsub">From the last election cycle to today. Colours mark the kind of event: <span style="color:${TAG_COL.Election}">election</span>, <span style="color:${TAG_COL.Government}">government</span>, <span style="color:${TAG_COL.Party}">party</span>, <span style="color:${TAG_COL.Courts}">courts</span>, <span style="color:${TAG_COL.Probe}">probe</span>.</p><div class="ts-tl">${tl}</div></section>
    <section class="gsec ts-two"><div class="card"><h2 class="gsec" style="font-size:11px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--accent);margin:0 0 6px">The fault lines</h2>${list(T.faultLines)}</div>
      <div class="card"><h2 style="font-size:11px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--accent);margin:0 0 6px">What to watch next</h2>${list(T.watch)}</div></section>
    <p class="foot" style="margin:0">Compiled from news reports up to ${fmtDate(T.asOf)}. Static, like the rest of this page: update <code>data/india-telangana.json</code> as things change.</p>`;
  tipHandlers(el);
}

function buildTable() {
  const N = 5;
  const head = `<tr><th>State</th>${Array.from({ length: N }, (_, i) => `<th>${i === 0 ? 'Latest election' : `${i} before`}</th>`).join('')}</tr>`;
  const body = byRegion().map(({ region: r, list, seats }) => {
    const rows = list.map(s => {
      const h = EL.assemblyHistory[s.name] || [];
      const cells = h.length ? Array.from({ length: N }, (_, i) => {
        const e = h[i];
        if (!e) return '<td></td>';
        const now = i === 0 && s.cm && s.cm !== e.cm
          ? `<span class="now">now: <b style="color:${tint(s.party)}">${esc(s.cm)}</b></span>` : '';
        return `<td data-tip="${esc(e.cm)} · ${esc(pname(e.cmParty))}"><span class="yr">${e.year}</span><span class="cmn" style="color:${tint(e.cmParty)}">${esc(e.cm)}</span>${now}</td>`;
      }).join('') : `<td colspan="${N}" class="nolg">No legislature — run by the ${esc(s.admin || 'Administrator')}</td>`;
      return `<tr class="row" tabindex="0" data-state="${esc(s.name)}">${stateCell(s)}${cells}</tr>`;
    }).join('');
    return `<tr class="reg"><td colspan="${N + 1}">${esc(r)}<span>${list.length} states & UTs · ${seats} Lok Sabha seats</span></td></tr>${rows}`;
  }).join('');
  const tv = document.getElementById('tview');
  tv.innerHTML = `<table class="ctab"><thead>${head}</thead><tbody>${body}</tbody></table>`;
  stateRowLinks(tv);
  tipHandlers(tv);
}

function setView(v) {
  const tv = document.getElementById('tview'), gv = document.getElementById('gview');
  if (v === 'table' && !tv.innerHTML) buildTable();
  if (v === 'gov' && !gv.innerHTML) buildGov();
  const tsv = document.getElementById('tsview');
  if (v === 'ts' && !tsv.innerHTML) buildTelangana();
  tsv.hidden = v !== 'ts';
  document.documentElement.classList.toggle('alt-view', v !== 'map');
  tv.hidden = v !== 'table';
  gv.hidden = v !== 'gov';
  ['map', 'table', 'gov', 'ts'].forEach(k => {
    const b = document.getElementById('view-' + k);
    b.classList.toggle('on', k === v);
    b.setAttribute('aria-pressed', k === v);
  });
  if (v !== 'map') { if (selected) close(); history.replaceState(null, '', '?view=' + v); }
  else if (!selected) history.replaceState(null, '', location.pathname);
}

function openIndia() {
  if (selected === '__india') return close();
  if (selected && byName[selected]) byName[selected].path.classList.remove('sel');
  selected = '__india';
  renderIndia();
  document.getElementById('stage').classList.add('open');
  document.getElementById('india-btn').classList.add('on');
  document.getElementById('jump').value = '';
  history.replaceState(null, '', '?state=IN');
}

function select(name) {
  const st = byName[name];
  if (!st) return;
  if (selected === name) return close();
  if (selected && byName[selected]) byName[selected].path.classList.remove('sel');
  document.getElementById('india-btn').classList.remove('on');
  selected = name;
  st.path.classList.add('sel');
  st.path.parentNode.appendChild(st.path);
  renderDetail(st);
  document.getElementById('stage').classList.add('open');
  document.getElementById('jump').value = name;
  history.replaceState(null, '', '?state=' + st.abbr);
  if (window.matchMedia('(max-width: 900px)').matches) {
    setTimeout(() => document.getElementById('detail').scrollIntoView({ behavior: 'smooth', block: 'start' }), 250);
  }
}

function close() {
  if (selected && byName[selected]) byName[selected].path.classList.remove('sel');
  document.getElementById('india-btn').classList.remove('on');
  selected = null;
  document.getElementById('stage').classList.remove('open');
  document.getElementById('jump').value = '';
  history.replaceState(null, '', location.pathname);
}

function setMode(m) {
  mode = m;
  ['party', 'ls', 'hist', 'plain'].forEach(k => {
    const b = document.getElementById('mode-' + k);
    b.classList.toggle('on', k === m);
    b.setAttribute('aria-pressed', k === m);
  });
  recolour();
}

async function init() {
  try {
    const [m, d, e, g, t] = await Promise.all([
      fetch('data/india-map.json').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }),
      fetch('data/india-states.json').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }),
      fetch('data/india-elections.json').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }),
      fetch('data/india-government.json').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }),
      fetch('data/india-telangana.json').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }),
    ]);
    MAP = m; DATA = d; EL = e; GOV = g; TS = t;
  } catch (e) {
    document.getElementById('map-wrap').innerHTML = '<div class="err">Couldn’t load the map data.</div>';
    return;
  }
  DATA.states.forEach(s => { byName[s.name] = s; });

  const nStates = DATA.states.filter(s => s.type === 'state').length;
  document.getElementById('subtitle').textContent = `${nStates} states · ${DATA.states.length - nStates} union territories — click one to see who governs it`;
  document.getElementById('foot').textContent = `Chief Ministers as of ${fmtDate(DATA.asOf)}. Results are seats won at each state's latest Assembly election and the ${EL.lokSabha.year} Lok Sabha election.`;

  const jump = document.getElementById('jump');
  [['state', 'States'], ['ut', 'Union territories']].forEach(([t, label]) => {
    const og = document.createElement('optgroup');
    og.label = label;
    DATA.states.filter(s => s.type === t).sort((a, b) => a.name.localeCompare(b.name)).forEach(s => og.appendChild(new Option(s.name, s.name)));
    jump.appendChild(og);
  });
  jump.addEventListener('change', () => jump.value ? select(jump.value) : close());

  buildMap();
  recolour();

  document.getElementById('mode-party').addEventListener('click', () => setMode('party'));
  document.getElementById('mode-plain').addEventListener('click', () => setMode('plain'));
  document.getElementById('mode-ls').addEventListener('click', () => setMode('ls'));
  document.getElementById('mode-hist').addEventListener('click', () => setMode('hist'));
  document.getElementById('india-btn').addEventListener('click', openIndia);
  document.getElementById('detail').addEventListener('mousemove', e => {
    const t = e.target.closest('[data-tip]');
    if (!t) return hideTip();
    const tip = document.getElementById('tip');
    tip.textContent = t.dataset.tip;
    tip.style.left = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8) + 'px';
    tip.style.top = (e.clientY + 14) + 'px';
    tip.classList.add('show');
  });
  document.getElementById('detail').addEventListener('mouseleave', hideTip);
  const capsBtn = document.getElementById('caps-btn');
  capsBtn.addEventListener('click', () => {
    const on = !capsBtn.classList.contains('on');
    capsBtn.classList.toggle('on', on);
    capsBtn.setAttribute('aria-pressed', on);
    document.getElementById('map-wrap').classList.toggle('no-caps', !on);
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && selected) close(); });

  document.getElementById('view-map').addEventListener('click', () => setView('map'));
  document.getElementById('view-table').addEventListener('click', () => setView('table'));
  document.getElementById('view-gov').addEventListener('click', () => setView('gov'));
  document.getElementById('view-ts').addEventListener('click', () => setView('ts'));
  const v = new URLSearchParams(location.search).get('view');
  if (['table', 'gov', 'ts'].includes(v)) setView(v);
  const q = new URLSearchParams(location.search).get('state');
  if (q && q.toUpperCase() === 'IN') openIndia();
  else if (q) {
    const hit = DATA.states.find(s => s.abbr.toLowerCase() === q.toLowerCase() || s.name.toLowerCase() === q.toLowerCase());
    if (hit) select(hit.name);
  }
}
init();
</script>
</body>
</html>
